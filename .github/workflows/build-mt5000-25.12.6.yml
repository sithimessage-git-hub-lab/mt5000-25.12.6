name: build-mt5000-25.12.6
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Verify patch integrity
        run: sha256sum -c patches/SHA256SUMS

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Clone OpenWrt v25.12.6
        run: git clone -q -b v25.12.6 --single-branch https://github.com/openwrt/openwrt.git openwrt

      - name: Apply MT5000 backport patch
        run: |
          cd openwrt
          git -c user.email=ci@local -c user.name=ci am --3way \
            "$GITHUB_WORKSPACE/patches/0001-mt5000-backport-25.12.patch"

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install .config and defconfig
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          echo "--- 仓库根目录内容 ---"
          ls -la
          CFG=""
          for c in configs/mt5000-25.12.config mt5000-25.12.config configs/config.txt config.txt seed.config .config; do
            if [ -f "$c" ]; then CFG="$c"; break; fi
          done
          if [ -z "$CFG" ]; then
            echo "::error::仓库里找不到配置文件，请核对上面列出的文件名"
            exit 1
          fi
          echo "使用配置文件: $CFG"
          echo "CFG=$CFG" >> "$GITHUB_ENV"
          cp "$CFG" openwrt/.config
          cd openwrt
          rm -rf tmp/
          make defconfig

      - name: Config sanity report
        if: always()
        run: |
          cd openwrt
          W="$GITHUB_WORKSPACE/${CFG:-config.txt}"
          grep -oE '^CONFIG_[A-Za-z0-9_]+=y' "$W" 2>/dev/null | sed 's/=y$//' | sort -u > /tmp/want || true
          grep -oE '^CONFIG_[A-Za-z0-9_]+=y' .config 2>/dev/null | sed 's/=y$//' | sort -u > /tmp/got || true
          echo "=== 你写了但没生效的符号（多半是无效包名）==="
          comm -23 /tmp/want /tmp/got || true
          echo "=== 实际生效的 target/device 行 ==="
          grep -E '^CONFIG_TARGET_(mediatek|mediatek_filogic)=' .config || true

      - name: Download sources
        run: cd openwrt && make -j$(nproc) download

      - name: Build
        run: cd openwrt && make -j$(nproc) V=s

      - name: List firmware output
        if: always()
        run: ls -la openwrt/bin/targets/mediatek/filogic/ || true

      - name: Upload resolved config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-config
          path: openwrt/.config
          include-hidden-files: true

      - name: Upload firmware bundle
        uses: actions/upload-artifact@v4
        with:
          name: mt5000-25.12.6-filogic
          path: openwrt/bin/targets/mediatek/filogic/
          include-hidden-files: true
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
